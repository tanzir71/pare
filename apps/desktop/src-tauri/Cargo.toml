[package]
name = "pare-desktop"
version = "0.1.0"
description = "Pare: make room on your PC, keep what matters."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "pare_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
pare-core = { path = "../../../crates/pare-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2.8.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
