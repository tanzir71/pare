[tool]
id = "windows"
name = "Windows"
category = "system"

[[rule]]
id = "windows.user-temp"
title = "Temporary files older than 1 day"
paths = ["%TEMP%/**"]
min_age_days = 1
tier = "safe"
disposal = "delete"
comes_back = "automatically"
why = "Files apps created for short-term use and didn't clean up."
if_removed = "Nothing you'd notice; files in use are skipped."
verified = true

[[rule]]
id = "windows.crash-dumps"
title = "App crash dumps"
paths = ["%LOCALAPPDATA%/CrashDumps/**"]
tier = "safe"
disposal = "recycle"
comes_back = "no"
why = "Memory dumps written when apps crashed."
if_removed = "You lose data for diagnosing old crashes."
verified = true

[[rule]]
id = "windows.thumbnail-cache"
title = "Thumbnail cache"
paths = ["%LOCALAPPDATA%/Microsoft/Windows/Explorer/thumbcache_*.db"]
tier = "safe"
disposal = "delete"
comes_back = "automatically"
why = "Preview images File Explorer stores for folders you've browsed."
if_removed = "Thumbnails regenerate as you browse. Files Explorer holds open are skipped."
verified = true

[[rule]]
id = "windows.wer"
title = "Windows error reports"
paths = ["%PROGRAMDATA%/Microsoft/Windows/WER/ReportArchive/**", "%PROGRAMDATA%/Microsoft/Windows/WER/ReportQueue/**"]
admin = true
tier = "safe"
disposal = "recycle"
comes_back = "no"
why = "Problem reports Windows collected after crashes."
if_removed = "Old reports in Reliability Monitor are gone."
verified = true

[[rule]]
id = "docker.vhdx-guide"
title = "Docker Desktop disk image"
paths = ["%LOCALAPPDATA%/Docker/wsl/disk/docker_data.vhdx", "%LOCALAPPDATA%/Docker/wsl/main/ext4.vhdx", "%LOCALAPPDATA%/Docker/wsl/data/ext4.vhdx"]
tier = "review"
disposal = "guide"
guide = ["Free space inside Docker: 'docker system prune' removes stopped containers, unused networks, dangling images and build cache ('docker system df' shows how much first).",
         "Quit Docker Desktop, then stop WSL with 'wsl --shutdown'.",
         "Compact the disk file as administrator. diskpart: select vdisk file=<file>, attach vdisk readonly, compact vdisk, detach vdisk. With Hyper-V you can use Optimize-VHD -Path <file> -Mode Full instead."]
comes_back = "no"
why = "Docker's virtual disk grows as you pull images but never shrinks on its own."
if_removed = "Pare never deletes it. Pruning removes stopped containers and unused images; compacting keeps everything else."
verified = true
sources = ["https://woshub.com/shrink-wsl2-and-docker-desktop-vhdx-files-in-windows/", "https://docs.docker.com/reference/cli/docker/system/prune/"]

[[rule.action]]
step = 0
label = "Prune unused Docker data"
run = ["docker", "system", "prune", "--force"]

[[rule.action]]
step = 1
label = "Shut down WSL"
run = ["wsl", "--shutdown"]

[[rule.action]]
step = 2
label = "Compact the disk"
run = ["pare:compact-vhd"]
admin = true

[[rule]]
id = "wsl.vhdx-guide"
title = "WSL Linux disk"
paths = ["%LOCALAPPDATA%/Packages/*/LocalState/ext4.vhdx", "%LOCALAPPDATA%/wsl/*/ext4.vhdx"]
tier = "review"
disposal = "guide"
guide = ["Free space inside Linux first, for example 'sudo apt clean' and deleting files you no longer need.",
         "Close every WSL window, then stop WSL with 'wsl --shutdown'.",
         "Compact the disk file as administrator. diskpart: select vdisk file=<file>, attach vdisk readonly, compact vdisk, detach vdisk. On WSL 2.0 or later you can instead let it shrink by itself: wsl --manage <distro> --set-sparse true."]
comes_back = "no"
why = "A WSL disk grows as Linux writes files but never shrinks on its own, even after you delete them."
if_removed = "Pare never deletes it. Compacting keeps every Linux file and gives unused space back to Windows."
verified = false
sources = ["https://learn.microsoft.com/windows/wsl/disk-space", "https://woshub.com/shrink-wsl2-and-docker-desktop-vhdx-files-in-windows/"]

[[rule.action]]
step = 1
label = "Shut down WSL"
run = ["wsl", "--shutdown"]

[[rule.action]]
step = 2
label = "Compact the disk"
run = ["pare:compact-vhd"]
admin = true

[[rule]]
id = "windows.component-store-guide"
title = "Windows Update leftovers"
paths = ["%WINDIR%/WinSxS"]
tier = "review"
disposal = "guide"
unmeasured = true
guide = ["Windows keeps older versions of components that updates replaced. Its own cleanup removes them after 30 days; you can run it now.",
         "In an administrator terminal: Dism.exe /Online /Cleanup-Image /StartComponentCleanup (it can take several minutes).",
         "Never delete files from WinSxS by hand: that can break Windows."]
comes_back = "no"
why = "Old versions of Windows components left behind by updates."
if_removed = "Replaced component versions are removed now instead of after 30 days. Pare never adds /ResetBase, which would stop installed updates from being uninstalled."
verified = false
sources = ["https://learn.microsoft.com/windows-hardware/manufacture/desktop/clean-up-the-winsxs-folder"]

[[rule.action]]
step = 1
label = "Run Windows Update cleanup"
run = ["dism.exe", "/Online", "/Cleanup-Image", "/StartComponentCleanup"]
admin = true
