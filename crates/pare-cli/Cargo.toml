[package]
name = "pare-cli"
description = "Pare on the command line: scan, explain and (carefully) clean. Also an MCP server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "pare"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
pare-core = { path = "../pare-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
