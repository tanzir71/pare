[package]
name = "pare-core"
description = "Pare's scanner, rules, safety model and disposal. No UI or Tauri code."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
# No https/ssh: Pare never talks to a remote, it only reads local repositories.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
globset = "0.4.21"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk"] }
thiserror = "2.0.21"
tracing = "0.1.44"
toml = "1.2.1"
trash = "5.4.0"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_RestartManager",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
filetime = "0.2.30"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[target.'cfg(windows)'.dev-dependencies]
junction = "2.1.0"
